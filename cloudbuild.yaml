substitutions:
  _REGION: us-central1
  _REPOSITORY: bigquery-bot-repo
  _SERVICE: sql-execution-gate

steps:
  - id: frontend-checks
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - frontend-test
      - --tag
      - sql-execution-gate-frontend-test:$BUILD_ID
      - .

  - id: backend-checks
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - backend-test
      - --tag
      - sql-execution-gate-backend-test:$BUILD_ID
      - .

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - runtime
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --quiet

  - id: smoke-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        service_url="$$(gcloud run services describe "${_SERVICE}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --format='value(status.url)')"

        probe() {
          name="$$1"
          url="$$2"
          expected="$$3"
          echo "Smoke-testing $$name: $$url"
          for attempt in $$(seq 1 12); do
            response="$$(curl --fail --silent --show-error \
              "$$url")" && \
              { [ -z "$$expected" ] || printf '%s' "$$response" | grep --quiet "$$expected"; } && {
                echo "$$name passed on attempt $$attempt"
                return 0
              }
            echo "$$name attempt $$attempt/12 failed; retrying in 5s"
            sleep 5
          done
          echo "$$name failed after 60s: $$url" >&2
          return 1
        }

        probe agent-discovery "$${service_url}/api/list-apps" '"app"'
        probe frontend "$${service_url}/app/" 'id="root"'

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY

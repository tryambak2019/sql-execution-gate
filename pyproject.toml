[project]
name = "fsbq-agent"
version = "0.1.0"
description = "A safety-gated BigQuery assistant with separate SQL planning and execution stages"
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.10,<3.14"

dependencies = [
    "google-adk>=1.8.0",
    "numpy",
    "pandas",
    "immutabledict",
    "google-genai",
    "google-cloud-bigquery",
    "google-cloud-aiplatform",
    "vertexai",
    "pydantic",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "python-dotenv",
    "absl-py",
    "pg8000",
    "sqlglot",
    "db-dtypes",
    "tabulate",
    "regex",
    "gcsfs",
    "google-cloud-logging",
    "protobuf",
    "opentelemetry-instrumentation-google-genai",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "nest-asyncio>=1.6.0",
    "agent-starter-pack>=0.14.1",
    "jupyter>=1.1.1",
    "ruff>=0.4.6",
    "mypy>=1.19.0",
    "codespell>=2.4.1",
    "types-pyyaml>=6.0.12.20240917",
    "types-requests>=2.32.4.20250913",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint.isort]
# Treat both app and frontend as internal packages
known-first-party = ["app"]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_subclassing_any = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
follow_imports = "silent"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["misc", "no-untyped-call", "no-any-return"]
exclude = [".venv", "frontend"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.agent-starter-pack]
base_template = "adk_base"
description = "A BigQuery assistant that presents generated SQL for explicit human approval before execution"
example_question = "Which 10 products generated the most revenue?"

[tool.agent-starter-pack.settings]
deployment_targets = ["agent_engine", "cloud_run"]
interactive_command = "dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
